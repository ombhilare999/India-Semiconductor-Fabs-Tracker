name: Fetch Fab News

on:
  schedule:
    - cron: '30 0 * * *'   # Daily at 6:00 AM IST (00:30 UTC)
  workflow_dispatch:         # Also allows manual trigger from GitHub UI

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch news for each fab
        run: python scripts/fetch_news.py

      - name: Commit updated news.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update fab news [skip actions]" && git push
