name: Fetch ISM Notifications

on:
  schedule:
    - cron: '30 1 * * *'   # Daily at 7:00 AM IST (01:30 UTC) — 1 hour before news fetch
  workflow_dispatch:         # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pypdf

      - name: Fetch ISM notifications
        id: fetch
        run: |
          python scripts/fetch_ism_notifications.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Commit if new notifications found
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ism_notifications.json

          # Only commit if more than just lastChecked changed
          MEANINGFUL=$(git diff --staged -- data/ism_notifications.json \
            | grep '^+' | grep -v '"lastChecked"' | wc -l)

          if [ "$MEANINGFUL" -gt 1 ]; then
            git commit -m "data: new ISM notifications detected [skip actions]"
            git push
            echo "Committed new notifications."
          else
            git restore --staged data/ism_notifications.json
            echo "No new notifications — skipping commit."
          fi
